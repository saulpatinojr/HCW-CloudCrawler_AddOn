# Dependabot baseline
#
# Keep only update blocks whose manifest or definition files exist. A block
# for a missing path causes configuration noise and does not provide coverage.
# Review labels and ownership against the target repository before installation.

version: 2
updates:
  # uv, not pip: uv updates pyproject.toml and uv.lock together, and the image build exports uv.lock itself
  # (infrastructure/docker/Dockerfile), so nothing else has to move.
  # The engine (cloud-crawler-core) is pinned by the address of its release file. uv rebuilds the whole lock for every
  # package Dependabot updates, and a failed request to that address made every update fail with "private source"
  # (issue 33). The fix is in pyproject.toml: the engine's metadata is given to uv in
  # [[tool.uv.dependency-metadata]], so uv never asks the address. Do not add a `registries` entry (the repository is
  # public; no credential is needed or wanted) or an `ignore` entry for the engine (it does not stop the failure). The
  # engine itself is moved only by .github/workflows/core-update.yml. Runbook: "Keeping Dependabot's Python updates
  # working" in docs/operations/runbook.md.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    # Every locked package, not only direct dependencies.
    allow: [{ dependency-type: all }]
    groups:
      # Pre-emptive: no Azure SDK may ever enter this edition; a grouped PR makes an attempt visible at a glance.
      azure-sdk: { patterns: ["azure-*", "msal*", "msrest*"] }
      dev: { dependency-type: development }
      # pydantic pins pydantic-core to one exact version, so the two must move in one pull request; a pydantic-core
      # bump on its own cannot resolve against the pinned pydantic.
      pydantic: { patterns: ["pydantic", "pydantic-core"] }
  # No docker entry. The base image follows the website's pin (infrastructure/docker/versions.env;
  # .github/workflows/base-update.yml opens the pull request that moves it) and the uv image used to export follows
  # UV_VERSION in ci.yml, which CI checks against the Dockerfile.
  # GitHub Actions under .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

