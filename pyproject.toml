[project]
name = "cloud-crawler-lab"
version = "0.2.0"
description = "Hybrid Cloud Works Cloud Crawler, lab edition: the credential-free AddOn that collects evidence handed to it, runs deterministic drift detectors and expires everything after two hours. No cloud connectivity by design."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.6,<3.15"
dependencies = [
  "cloud-crawler-core @ https://github.com/saulpatinojr/HCW-CloudCrawler_App/releases/download/v0.1.0/cloud_crawler_core-0.1.0-py3-none-any.whl",  # CORE_REF v0.1.0
  "fastapi==0.156.8",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.1",
  "httpx==0.28.1",
  "pip-audit==2.10.1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

# The engine is pinned by release-asset URL (a direct reference); hatchling refuses those unless this is set. It only
# affects building this project's own wheel, which is never published (the image copies the source tree).
[tool.hatch.metadata]
allow-direct-references = true

# The engine's own metadata, copied from the wheel (the METADATA file inside it). Why it is here: whenever uv has to
# re-resolve the lock, as Dependabot's uv job does for every update it tries, uv asks the wheel's address for the wheel's
# metadata, and its first request is a HEAD. GitHub answers that address with a redirect to a signed download link; in
# Dependabot's runs the signed link answered the HEAD with 401, which Dependabot reports as a "private source" failure
# before it stops the whole job (issue 33). With the metadata given here uv never asks the address. The version must be
# the pinned wheel's: core-update.yml moves it with the pin (the CORE_METADATA marker), and
# tests/security/test_engine_adoption.py compares every field with the installed wheel. Runbook: "Keeping Dependabot's
# Python updates working".
[[tool.uv.dependency-metadata]]
name = "cloud-crawler-core"
version = "0.1.0"  # CORE_METADATA
requires-python = ">=3.14.6,<3.15"
requires-dist = ["pydantic>=2.14,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_crawler_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "error::DeprecationWarning:cloud_crawler_lab",
  # starlette 1.7 prefers httpx2 for its TestClient; httpx is the client this edition pins, so the notice is muted
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true
